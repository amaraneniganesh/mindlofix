name: BMS Hourly Scraper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install playwright cryptography

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Create data directory
        run: mkdir -p data

      - name: Run scraper
        env:
          SUPER_KEY: ${{ secrets.SUPER_KEY }}
        run: python liverun.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # This ensures old deleted files are registered by git
          git add --all data/
          
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "Update data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push